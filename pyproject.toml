[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-python-checkout"
version = "1.0.0"
description = "Framework-agnostic payment checkout library for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nik2208" }]
keywords = ["payment", "checkout", "paypal", "nexi", "satispay", "framework-agnostic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "isort>=5.12",
    "pre-commit>=3.0",
    "types-requests>=2.31.0",
]
django = ["django>=4.0"]
fastapi = ["fastapi>=0.95", "uvicorn>=0.20"]
flask = ["flask>=2.0"]

[project.urls]
Homepage = "https://github.com/nik2208/awesome-python-checkout"
Repository = "https://github.com/nik2208/awesome-python-checkout.git"
Documentation = "https://github.com/nik2208/awesome-python-checkout#readme"
Issues = "https://github.com/nik2208/awesome-python-checkout/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
